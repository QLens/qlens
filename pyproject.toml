[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlens"
version = "0.3.0"
description = "A testing, debugging, and observability SDK for quantum programs, simulator-first."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mo Shehu" }]
keywords = [
    "quantum",
    "quantum-computing",
    "testing",
    "debugging",
    "qiskit",
    "pennylane",
    "pytest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Physics",
    "Framework :: Pytest",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    # The trace layer and viewer are built on TraceAct's record format;
    # it's core infrastructure, not an optional integration. Zero
    # transitive dependencies of its own.
    "traceact>=0.14",
]

[project.optional-dependencies]
qiskit = ["qiskit>=2.5"]
pennylane = ["pennylane>=0.45"]
dev = [
    "qiskit>=2.5",
    "pennylane>=0.45",
    "pytest>=8",
    "pytest-randomly>=3.15",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/qlens/qlens"
Documentation = "https://github.com/qlens/qlens/blob/main/USAGE.md"
Changelog = "https://github.com/qlens/qlens/blob/main/CHANGELOG.md"
Issues = "https://github.com/qlens/qlens/issues"
Source = "https://github.com/qlens/qlens"
Author = "https://mohammedshehu.com"

[project.scripts]
qlens = "qlens.viewer.cli:main"

# The bundled pytest plugin. Installing qlens makes the fixtures/markers
# available in any pytest run without a separate pytest-qlens package.
[project.entry-points.pytest11]
qlens = "qlens.pytest_plugin"

# First-party backends register through the same entry-point group a
# third-party backend (e.g. qlens-cirq) would use. The registry discovers
# backends exclusively through this group — no private shortcuts.
[project.entry-points."qlens.backends"]
qiskit = "qlens.backends._qiskit:QiskitBackend"
pennylane = "qlens.backends._pennylane:PennyLaneBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/qlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The quickstart test runs USAGE.md's code blocks via exec by design:
# executing the documented snippet verbatim is the point of the test.
"tests/test_quickstart.py" = ["S102"]
# Recording must never break the user's run — the TraceAct adapter
# convention. Broad catches around trace emission are the contract, not
# an oversight.
"src/qlens/tracing/__init__.py" = ["BLE001", "S112"]
# A request handler converts any per-request failure into a 500 response
# rather than killing the server thread.
"src/qlens/viewer/server.py" = ["BLE001"]

[tool.mypy]
strict = true
# Analysis version 3.12, not the 3.11 runtime floor: numpy's stubs use the
# PEP 695 `type` statement, which mypy only parses when targeting >=3.12.
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["qiskit.*", "pennylane.*", "scipy.*", "traceact.*"]
ignore_missing_imports = true
